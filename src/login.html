<!DOCTYPE html>
<html>
<head>
    <title>Digital Visitor Entry & Gate Pass Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-box">

    <h2>Digital Visitor Entry <br> & Gate Pass Management System</h2>

    <form id="loginForm">
        <div class="role-toggle" role="group" aria-label="Select user role">
            <button type="button" class="role-btn active" data-role="student">Student</button>
            <button type="button" class="role-btn" data-role="staff">Staff</button>
        </div>

        <input type="hidden" id="loginRole" value="student">

        <label>Username</label>
        <input id="loginUsername" type="text" placeholder="Enter Username" required>

        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="Enter Password" required>

        <button type="submit">Login</button>
    </form>

    <hr>

    <a href="register-account.html">
        <button type="button">Create Account</button>
    </a>

</div>
<script src="script.js"></script>
</body>
</html>
